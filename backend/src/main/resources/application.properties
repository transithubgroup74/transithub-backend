spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transithub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# No default on purpose — the app must be given a real JWT_SECRET (set on
# Railway). Failing to start is safer than silently using a public value.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=${PORT:8080}

# Mail delivery. Railway blocks outbound SMTP on every port, so production
# sends through Brevo's HTTPS API — set BREVO_API_KEY and MAIL_FROM (the
# address verified as a sender in Brevo). Without a key it falls back to the
# SMTP settings below, which still work when running locally.
brevo.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:TransitHub}

# SMTP fallback (local development only — see above).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# Without these a blocked SMTP port hangs the request thread indefinitely —
# it took registration (and booking receipts) past two minutes with no reply.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
