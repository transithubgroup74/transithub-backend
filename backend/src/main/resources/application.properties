spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transithub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# No default on purpose — the app must be given a real JWT_SECRET (set on
# Railway). Failing to start is safer than silently using a public value.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=${PORT:8080}

# Email (Gmail SMTP) — set MAIL_USERNAME and MAIL_PASSWORD on Railway
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
